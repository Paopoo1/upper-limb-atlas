<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="右上肢の骨に筋と靱帯を付けた3Dビューア。筋を選ぶと起始・停止の穴が光ります。">
<title>上肢3D筋アトラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one-screen lab bench — 3D stage on the left, specimen card + muscle index on the right; stacks on phones */
:root{
  --bg:#F3F0EA; --panel:#FBF9F5; --ink:#1F2732; --muted:#5B6573; --line:#DDD6C9;
  --accent:#B0412C; --origin:#C8372D; --insertion:#2C64A8; --lig:#2E8B57; --stage:#E9E4DA; --bone:#E8DFCB;
  --display:'Zen Kaku Gothic New','BIZ UDPGothic','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'BIZ UDPGothic','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181E; --panel:#1C222A; --ink:#E9E5DD; --muted:#A3ACB8; --line:#323B46;
  --accent:#E07A5F; --origin:#F06A5E; --insertion:#6FA3E6; --lig:#5CC28A; --stage:#1A1F26; --bone:#D9CFBA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181E; --panel:#1C222A; --ink:#E9E5DD; --muted:#A3ACB8; --line:#323B46;
  --accent:#E07A5F; --origin:#F06A5E; --insertion:#6FA3E6; --lig:#5CC28A; --stage:#1A1F26; --bone:#D9CFBA; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);gap:0;padding-inline:16px;padding-block:12px;box-sizing:border-box;column-gap:16px;row-gap:10px}
header{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.views{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--stage)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:6px 10px;border-radius:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toggles{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tag{position:absolute;transform:translate(-50%,-130%);pointer-events:none;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
aside{min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font-family:var(--display);font-size:1.25rem;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--body);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.04em}
dl{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 10px;margin:8px 0 0}
dt{color:var(--muted);font-size:.82rem;padding-top:1px}
dd{margin:0}
.note{margin-top:8px;font-size:.85rem;color:var(--accent);font-weight:700}
.index{flex:1;min-height:0;overflow:auto;padding:8px 10px}
.index h3{font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:10px 6px 4px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;border-radius:8px;background:transparent;padding:5px 8px}
.row:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.sw.lig{height:6px;border-radius:2px}
.hint{font-size:.8rem;color:var(--muted)}
.credit{font-size:.72rem;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 56vh auto;height:auto}
  html,body{height:auto}
  .index{max-height:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="app">
  <header>
    <div>
      <h1>上肢3D筋アトラス</h1>
      <div class="sub">右上肢・印刷用の骨モデルと同じデータ。筋をタップすると、その筋だけが残り、起始と停止の穴が光ります。</div>
    </div>
    <div class="views" role="group" aria-label="視点">
      <button id="v-ant" data-view="ant">前から</button>
      <button id="v-post" data-view="post">後ろから</button>
      <button id="v-lat" data-view="lat">外側から</button>
      <button id="v-med" data-view="med">内側から</button>
      <button id="v-top" data-view="top">上から</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="上肢の骨と筋の3Dモデル。ドラッグで回転、ホイールかピンチで拡大"></canvas>
    <div class="loading" id="loading">骨のデータを読み込んでいます…</div>
    <div class="toggles">
      <button id="t-ghost" aria-pressed="false">骨を半透明</button>
      <button id="t-marks" aria-pressed="true">付着部の点</button>
      <button id="t-lig" aria-pressed="true">靱帯</button>
      <button id="t-reset">選択を解除</button>
    </div>
    <div class="hud">
      <span><span class="dot" style="background:var(--origin)"></span>起始</span>
      <span><span class="dot" style="background:var(--insertion)"></span>停止</span>
      <span><span class="dot" style="background:var(--lig)"></span>靱帯の付着</span>
      <span>ドラッグ：回転　右ドラッグ／2本指：移動</span>
    </div>
  </div>

  <aside>
    <div class="card" id="info">
      <h2 id="i-name">筋を選んでください</h2>
      <div class="hint" id="i-hint">一覧か3Dの筋をタップすると、その筋だけを表示して、起始と停止のために開けた骨の穴が同じ色で光ります。</div>
      <dl id="i-dl" hidden>
        <dt>起始</dt><dd id="i-o"></dd>
        <dt>停止</dt><dd id="i-i"></dd>
        <dt id="i-at">作用</dt><dd id="i-a"></dd>
        <dt id="i-nt">神経</dt><dd id="i-n"></dd>
      </dl>
      <div class="note" id="i-note" hidden></div>
    </div>
    <div class="card index" id="index"></div>
    <div class="credit">骨：NIH 3D の上肢モデル（右）を元に作成。筋と靱帯は、紐を付ける穴の位置と走行を簡略化して示しています。</div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const INFO={
 "棘上筋":{g:"肩：腱板",o:"棘上窩",i:"大結節（上面）",a:"肩の外転（動き始め）、骨頭の安定",n:"肩甲上神経",note:"腱板断裂・インピンジメント",r:5.5},
 "棘下筋":{g:"肩：腱板",o:"棘下窩",i:"大結節（中面）",a:"肩の外旋",n:"肩甲上神経",note:"投球肩（インターナルインピンジメント）",r:6},
 "小円筋":{g:"肩：腱板",o:"肩甲骨外側縁の上部",i:"大結節（下面）",a:"肩の外旋",n:"腋窩神経",r:4.5},
 "肩甲下筋":{g:"肩：腱板",o:"肩甲下窩（肩甲骨の前面）",i:"小結節",a:"肩の内旋",n:"肩甲下神経",note:"肩関節前方脱臼で引き伸ばされる",r:6.5},
 "三角筋前部":{g:"肩：表層",o:"鎖骨の外側1/3",i:"三角筋粗面",a:"肩の屈曲・内旋",n:"腋窩神経",r:7},
 "三角筋中部":{g:"肩：表層",o:"肩峰",i:"三角筋粗面",a:"肩の外転",n:"腋窩神経",r:8},
 "三角筋後部":{g:"肩：表層",o:"肩甲棘",i:"三角筋粗面",a:"肩の伸展・外旋",n:"腋窩神経",r:7},
 "大胸筋（鎖骨頭）":{g:"肩：表層",o:"鎖骨の内側1/2",i:"大結節稜",a:"肩の屈曲・内転・内旋",n:"外側・内側胸筋神経",note:"ベンチプレスでの断裂",r:7},
 "大円筋":{g:"肩：表層",o:"肩甲骨下角の後面",i:"小結節稜",a:"肩の伸展・内転・内旋",n:"下肩甲下神経",note:"投球での損傷",r:6},
 "烏口腕筋":{g:"肩：表層",o:"烏口突起",i:"上腕骨内側の中央",a:"肩の屈曲・内転",n:"筋皮神経",r:4},
 "上腕二頭筋 長頭":{g:"上腕",o:"関節上結節（骨頭の上を越えて結節間溝へ）",i:"橈骨粗面",a:"肘の屈曲・前腕の回外・肩の屈曲",n:"筋皮神経",note:"SLAP損傷・長頭腱炎",r:5.5},
 "上腕二頭筋 短頭":{g:"上腕",o:"烏口突起",i:"橈骨粗面",a:"肘の屈曲・前腕の回外・肩の屈曲",n:"筋皮神経",note:"遠位腱断裂（橈骨粗面）",r:5.5},
 "上腕筋":{g:"上腕",o:"上腕骨前面の遠位半分",i:"尺骨粗面",a:"肘の屈曲",n:"筋皮神経",r:6.5},
 "上腕三頭筋 長頭":{g:"上腕",o:"関節下結節",i:"肘頭",a:"肘の伸展・肩の伸展",n:"橈骨神経",note:"ベネット病変（投球）",r:6.5},
 "上腕三頭筋 外側頭":{g:"上腕",o:"上腕骨後面（橈骨神経溝の上）",i:"肘頭",a:"肘の伸展",n:"橈骨神経",r:6.5},
 "上腕三頭筋 内側頭":{g:"上腕",o:"上腕骨後面（橈骨神経溝の下）",i:"肘頭",a:"肘の伸展",n:"橈骨神経",r:6},
 "腕橈骨筋":{g:"前腕・手",o:"外側顆上稜",i:"橈骨茎状突起",a:"肘の屈曲",n:"橈骨神経",r:5},
 "円回内筋":{g:"前腕・手",o:"内側上顆（と鉤状突起）",i:"橈骨外側面の中央",a:"前腕の回内",n:"正中神経",r:4.5},
 "回外筋":{g:"前腕・手",o:"外側上顆・尺骨の回外筋稜",i:"橈骨近位の外側",a:"前腕の回外",n:"橈骨神経（深枝）",r:4.5},
 "短橈側手根伸筋（ECRB）":{g:"前腕・手",o:"外側上顆",i:"第3中手骨底（手の甲側）",a:"手首の背屈",n:"橈骨神経（深枝）",note:"テニス肘（上腕骨外側上顆炎）",r:4},
 "橈側手根屈筋（FCR）":{g:"前腕・手",o:"内側上顆",i:"第2中手骨底（手のひら側）",a:"手首の掌屈・橈屈",n:"正中神経",note:"ゴルフ肘・野球肘（屈筋群の代表）",r:4},
 "内側側副靱帯（UCL）":{g:"靱帯",o:"内側上顆",i:"尺骨の鉤状突起の内側",a:"肘が外へ開くのを止める",note:"野球肘・トミー・ジョン手術"},
 "外側側副靱帯（LUCL）":{g:"靱帯",o:"外側上顆",i:"尺骨の回外筋稜",a:"肘が後外側へずれるのを止める",note:"肘関節脱臼"},
 "輪状靱帯":{g:"靱帯",o:"尺骨の橈骨切痕の前縁",i:"同じく後縁（橈骨頭を一周）",a:"橈骨頭を尺骨に保持する",note:"肘内障（子ども）"},
 "烏口鎖骨靱帯":{g:"靱帯",o:"烏口突起",i:"鎖骨の下面",a:"鎖骨が浮き上がるのを止める",note:"肩鎖関節脱臼（重症型）"},
 "肩鎖靱帯":{g:"靱帯",o:"肩峰",i:"鎖骨の外側端",a:"肩鎖関節を安定させる",note:"肩鎖関節脱臼"},
 "烏口肩峰靱帯":{g:"靱帯",o:"烏口突起",i:"肩峰",a:"骨頭の上の屋根（烏口肩峰アーチ）",note:"インピンジメント"},
 "下関節上腕靱帯（IGHL）":{g:"靱帯",o:"関節窩の前下縁",i:"上腕骨の解剖頸",a:"外転・外旋で骨頭が前下方へ外れるのを止める",note:"肩関節前方脱臼・バンカート損傷"},
};
const GROUPS=["肩：腱板","肩：表層","上腕","前腕・手","靱帯"];
// anatomical directions of this specimen (three.js coordinates)
const V=(x,y,z)=>new THREE.Vector3(x,y,z).normalize();
const ANT=V(0.993,-0.116,0.026), LAT=V(0.031,0.466,0.884), SUP=V(0.115,0.877,-0.466);
const VIEWS={ant:ANT, post:ANT.clone().negate(), lat:LAT, med:LAT.clone().negate(), top:SUP.clone().add(ANT.clone().multiplyScalar(0.25)).normalize()};

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv=document.getElementById('cv'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,1,6000);
camera.up.copy(SUP);
const controls=new THREE.OrbitControls(camera,cv);
controls.enableDamping=true; controls.dampingFactor=0.08;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7f70,0.85));
const key=new THREE.DirectionalLight(0xffffff,0.75); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.3); scene.add(fill);

function applyTheme(){
  scene.background=new THREE.Color(css('--stage'));
  boneMat.color=new THREE.Color(css('--bone'));
  markMats.origin.color.set(css('--origin')); markMats.insertion.color.set(css('--insertion')); markMats.ligament.color.set(css('--lig'));
}
const boneMat=new THREE.MeshStandardMaterial({color:0xe8dfcb,roughness:0.85,metalness:0,transparent:true,opacity:1});
const markMats={origin:new THREE.MeshStandardMaterial({color:0xc8372d,roughness:.4}),insertion:new THREE.MeshStandardMaterial({color:0x2c64a8,roughness:.4}),ligament:new THREE.MeshStandardMaterial({color:0x2e8b57,roughness:.4})};
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let center=new THREE.Vector3(), radius=400;
const muscles=[]; const markers=[]; const tags=[]; const walls=[]; let ringData=[];
const ui={marks:true,lig:true};
let selected=null;

function spindle(pts,rmax,flat){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'centripetal');
  const T=72,R=14, geo=new THREE.TubeGeometry(curve,T,1,R,false);
  const pos=geo.attributes.position, c=new THREE.Vector3(), v=new THREE.Vector3();
  const frames=curve.computeFrenetFrames(T,false);
  for(let i=0;i<=T;i++){
    const t=i/T; curve.getPointAt(t,c);
    const r=flat? 1 : 1.4+(rmax-1.4)*Math.pow(Math.sin(Math.PI*t),0.75);
    for(let j=0;j<=R;j++){
      const k=i*(R+1)+j; v.fromBufferAttribute(pos,k).sub(c);
      if(flat){ // flatten into a band: wide along the binormal, thin along the normal
        const b=v.dot(frames.binormals[i]), n=v.dot(frames.normals[i]);
        v.copy(frames.binormals[i]).multiplyScalar(b*3.2).add(frames.normals[i].clone().multiplyScalar(n*0.9));
      } else v.multiplyScalar(r);
      pos.setXYZ(k,c.x+v.x,c.y+v.y,c.z+v.z);
    }
  }
  geo.computeVertexNormals(); return {geo,curve};
}

function select(m){
  selected=m;
  for(const x of muscles){
    x.mesh.visible = m ? x===m : (x.kind!=='ligament'||ui.lig);
    x.mesh.material.emissive.setHex(0x000000);
    if(x.btn) x.btn.setAttribute('aria-pressed',String(x===m));
  }
  walls.forEach(w=>w.visible=false);
  markers.forEach((s,i)=>s.visible= m ? false : ui.marks);
  if(m){
    for(const ri of m.rings){
      const w=walls[ri]; if(!w) continue;
      w.material.color.set(m.hex); w.material.emissive.set(m.hex); w.visible=true;
    }
  }
  tags.forEach(t=>t.el.remove()); tags.length=0;
  const info=m?INFO[m.name]||{}:null;
  document.getElementById('i-name').innerHTML=m?`${m.name} <span class="chip" style="color:${m.kind==='ligament'?'var(--lig)':'var(--accent)'}">${m.kind==='ligament'?'靱帯':'筋'}</span>`:'筋を選んでください';
  document.getElementById('i-hint').hidden=!!m;
  document.getElementById('i-dl').hidden=!m;
  const note=document.getElementById('i-note');
  if(m){
    const lig=m.kind==='ligament';
    document.getElementById('i-o').textContent=info.o||'';
    document.getElementById('i-i').textContent=info.i||'';
    document.getElementById('i-a').textContent=info.a||'';
    document.getElementById('i-at').textContent=lig?'働き':'作用';
    document.getElementById('i-n').textContent=info.n||'—';
    document.getElementById('i-nt').hidden=lig; document.getElementById('i-n').hidden=lig;
    note.hidden=!info.note; note.textContent=info.note?`けがとの関係：${info.note}`:'';
    const ends=[[m.pts[0],lig?'--lig':'--origin',lig?'付着':'起始'],[m.pts[m.pts.length-1],lig?'--lig':'--insertion',lig?'付着':'停止']];
    for(const [p,c,label] of ends){
      const el=document.createElement('div'); el.className='tag'; el.textContent=label; el.style.background=`var(${c})`;
      stage.appendChild(el); tags.push({el,p:new THREE.Vector3(...p)});
    }
    const mid=m.curve.getPointAt(0.5);
    controls.target.lerp(mid,0.6);
  } else { note.hidden=true; controls.target.copy(center); }
}

function buildIndex(){
  const idx=document.getElementById('index'); idx.innerHTML='';
  for(const g of GROUPS){
    const h=document.createElement('h3'); h.textContent=g; idx.appendChild(h);
    for(const m of muscles.filter(x=>(INFO[x.name]||{}).g===g)){
      const b=document.createElement('button'); b.className='row'; b.setAttribute('aria-pressed','false');
      b.innerHTML=`<span class="sw ${m.kind==='ligament'?'lig':''}" style="background:${m.hex}"></span><span>${m.name}</span>`;
      b.addEventListener('click',()=>select(selected===m?null:m));
      m.btn=b; idx.appendChild(b);
    }
  }
}

function setView(k){
  const d=VIEWS[k]; camera.position.copy(center).add(d.clone().multiplyScalar(radius*3.4));
  camera.up.copy(k==='top'?ANT.clone().negate():SUP); controls.target.copy(selected?controls.target:center); controls.update();
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===k)));
}

Promise.all([
  fetch('anatomy.json').then(r=>{if(!r.ok) throw new Error('anatomy.json');return r.json();}),
  new Promise((res,rej)=>new THREE.GLTFLoader().load('bones.glb',res,undefined,rej))
]).then(([data,gltf])=>{
  const bones=gltf.scene; bones.traverse(o=>{if(o.isMesh){o.material=boneMat;o.renderOrder=0;}});
  scene.add(bones);
  const box=new THREE.Box3().setFromObject(bones); box.getCenter(center); radius=box.getSize(new THREE.Vector3()).length()/2;
  for(const L of data.lines){
    const lig=L.kind==='ligament', info=INFO[L.name]||{};
    const {geo,curve}=spindle(L.pts,info.r||4,lig);
    const col=new THREE.Color().setRGB(...L.color);
    const mat=new THREE.MeshStandardMaterial({color:col,roughness:lig?.35:.55,metalness:0,transparent:true,opacity:1,emissive:0x000000});
    const mesh=new THREE.Mesh(geo,mat); mesh.renderOrder=2; scene.add(mesh);
    const m={name:L.name,kind:L.kind,mesh,curve,pts:L.pts,hex:'#'+col.getHexString()}; mesh.userData.m=m; muscles.push(m);
  }
  const sg=new THREE.SphereGeometry(2.6,16,12);
  ringData=data.rings;
  for(const r of data.rings){
    const s=new THREE.Mesh(sg,markMats[r.kind]); s.position.set(...r.pos); s.renderOrder=3; scene.add(s); markers.push(s);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(r.wall||[],3)); g.computeVertexNormals();
    const wm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.8,roughness:.4,side:THREE.DoubleSide,
      polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
    const w=new THREE.Mesh(g,wm); w.visible=false; w.renderOrder=4; scene.add(w); walls.push(w);
  }
  const near=p=>{let best=-1,bd=1e9; data.rings.forEach((r,i)=>{const d=Math.hypot(r.pos[0]-p[0],r.pos[1]-p[1],r.pos[2]-p[2]); if(d<bd){bd=d;best=i;}}); return bd<25?best:-1;};
  for(const m of muscles){ m.rings=[near(m.pts[0]),near(m.pts[m.pts.length-1])].filter(i=>i>=0); }
  buildIndex(); setView('ant'); document.getElementById('loading').hidden=true;
}).catch(e=>{document.getElementById('loading').textContent='3Dデータを読み込めませんでした。ページを再読み込みしてください。';console.error(e);});

document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
const tg=(id,fn)=>{const b=document.getElementById(id);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));fn(on);});};
tg('t-ghost',on=>{boneMat.opacity=on?0.35:1;boneMat.depthWrite=!on;});
tg('t-marks',on=>{ui.marks=on; if(!selected) markers.forEach(s=>s.visible=on);});
tg('t-lig',on=>{ui.lig=on; if(!selected) muscles.forEach(m=>{if(m.kind==='ligament') m.mesh.visible=on;});});
document.getElementById('t-reset').addEventListener('click',()=>select(null));

// tap / click picking (ignore drags)
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return;
  const r=cv.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(muscles.filter(m=>m.mesh.visible).map(m=>m.mesh))[0];
  if(hit) select(hit.object.userData.m===selected?null:hit.object.userData.m);
});

function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();
const tmp=new THREE.Vector3(); const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){
  requestAnimationFrame(loop); controls.update();
  const pulse=0.55+0.45*Math.sin(performance.now()/260); walls.forEach(w=>{if(w.visible) w.material.emissiveIntensity=reduceMotion?0.8:pulse;});
  key.position.copy(camera.position).add(SUP.clone().multiplyScalar(radius)); fill.position.copy(center).sub(camera.position).add(center);
  renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const t of tags){tmp.copy(t.p).project(camera); t.el.style.left=((tmp.x+1)/2*w)+'px'; t.el.style.top=((1-tmp.y)/2*h)+'px'; t.el.hidden=tmp.z>1;}
})();
</script>
